name: Build & Update Auth Service

on:
  push:
    branches:
      - main
    paths:
      - "app/auth-service/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: auth-service
  APP_DIR: app/auth-service
  VALUES_FILE: helm/auth-service/values.yaml

jobs:
  build-and-update-helm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          SHORT_SHA="${IMAGE_TAG::7}"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${SHORT_SHA}"
          echo "IMAGE_TAG=${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"
          echo "ECR_REGISTRY=${ECR_REGISTRY}" >> "$GITHUB_ENV"
          docker build -t "${IMAGE_URI}" -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" "${APP_DIR}"

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_URI }}
          format: "table"
          exit-code: "0" # Change to "1" to fail the pipeline on findings
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Push Docker image to ECR
        run: |
          docker push "${IMAGE_URI}"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

      - name: Update Helm chart image tag
        run: |
          yq -i '.image.tag = strenv(IMAGE_TAG)' "${VALUES_FILE}"

      - name: Commit and push updated Helm values
        run: |
          git config user.name "marceleno1717"
          git config user.email "maro.keko17@gmail.com"
          git add "${VALUES_FILE}"
          if ! git diff --cached --quiet; then
            git commit -m "chore(${ECR_REPOSITORY}): update image tag to ${IMAGE_TAG} [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
